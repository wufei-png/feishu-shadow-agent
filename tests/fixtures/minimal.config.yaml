owner:
  open_id: ou_owner
  name: Owner

daemon:
  tick_interval_seconds: 1
  overlap_seconds: 120

health:
  interval_seconds: 300
  retry_interval_seconds: 60
  timeout_seconds: 1

storage:
  sqlite_path: data/test.sqlite3
  resource_dir: data/resources
  max_resource_bytes: 52428800
  max_resource_dir_bytes: 2147483648

logging:
  jsonl_path: logs/test.jsonl
  level: info
  console: false
  text_path: logs/test.log

lark_cli:
  path: null
  timeout_seconds: 5

agent_backend:
  provider: hermes
  working_dir: null
  config_scope: isolated
  auto_context: disabled
  explicit_context:
    paths: []
  hermes:
    mode: cli
    path: hermes
    source: feishu-shadow-agent
    router_max_turns: 4
    session_max_turns: 8
    model: null
    provider: null
    timeout_seconds: 1
    skill_paths: []
    health_url: null
    api_key_env: HERMES_API_KEY
  codex:
    path: null
    model: null
    reasoning_effort: null
    timeout_seconds: 1
    skills: []
  claude_code:
    path: null
    model: null
    timeout_seconds: 1

reply_policy:
  p2p_auto_reply: true
  unknown_group_auto_reply: false

chats:
  oc_test:
    name: Test Chat
    auto_reply: true
    bot_joined: true

tool_permissions: read_only

retention:
  raw_message_days: 30
  resource_days: 30

lifecycle:
  watch_minutes: 120
  burst_attach_seconds: 60
  closed_recall_days: 7
  approval_timeout_hours: 24

debug:
  save_full_agent_io: false
