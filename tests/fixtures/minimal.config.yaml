owner:
  open_id: ou_owner
  name: Owner

daemon:
  tick_interval_seconds: 1
  overlap_seconds: 120

health:
  interval_seconds: 300
  retry_interval_seconds: 60
  timeout_seconds: 1

storage:
  sqlite_path: data/test.sqlite3

logging:
  jsonl_path: logs/test.jsonl

lark_cli:
  path: lark-cli
  timeout_seconds: 5

hermes:
  health_url: https://hermes.local/health
  api_key_env: HERMES_API_KEY
  timeout_seconds: 1

reply_policy:
  p2p_auto_reply: true
  default_group_auto_reply: false
  risk_level_max: low
  confidence_threshold: 0.85

chats:
  oc_test:
    name: Test Chat
    auto_reply: true
    bot_joined: true

tool_permissions:
  profile: guarded_write

retention:
  raw_message_days: 30
  resource_days: 30

debug:
  save_full_hermes_io: false
