name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend static quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.4"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked project environment
        run: uv sync --locked --extra cards
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Pyright
        run: uv run --locked pyright

  backend:
    name: Backend tests (Python ${{ matrix.python }}, ${{ matrix.timezone }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            timezone: UTC
          - python: "3.11"
            timezone: Asia/Shanghai
          - python: "3.11"
            timezone: America/Los_Angeles
          - python: "3.12"
            timezone: UTC
          - python: "3.13"
            timezone: UTC
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.4"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked project environment
        run: uv sync --locked --extra cards
      - name: Full test suite
        run: uv run --locked pytest -q

  frontend:
    name: Operator Console build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/operator-console/package-lock.json
      - name: Install frontend dependencies
        id: install
        run: npm --prefix frontend/operator-console ci
      - name: Lint Operator Console
        run: npm --prefix frontend/operator-console run lint
      - name: Test Operator Console
        run: npm --prefix frontend/operator-console test
      - name: Build bundled Operator Console
        run: npm --prefix frontend/operator-console run build
      - name: Verify bundled assets are current
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/console-static-status.txt"
          if ! git status --porcelain=v1 --untracked-files=all -- src/feishu_shadow_agent/console_static > "$status_file"; then
            echo "::error::git status failed while verifying bundled Operator Console assets"
            exit 1
          fi
          if [ -s "$status_file" ]; then
            echo "::error::Bundled Operator Console assets are stale or untracked:"
            cat "$status_file"
            exit 1
          fi
          echo "Bundled Operator Console assets are current."
      - name: Audit frontend dependencies
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test .github/scripts/frontend-audit.test.mjs
          node .github/scripts/frontend-audit.mjs

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.4"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked project environment
        run: uv sync --locked
      - name: Build distributions
        run: uv run --locked python -m build
      - name: Inspect wheel assets
        run: |
          uv run --locked python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              index = "feishu_shadow_agent/console_static/index.html"
              assert index in names, f"missing {index}"
              html = archive.read(index).decode("utf-8")
              for ref in html.split('/assets/')[1:]:
                  asset = ref.split('"', 1)[0].split("'", 1)[0]
                  path = f"feishu_shadow_agent/console_static/assets/{asset}"
                  assert path in names, f"missing {path}"
          PY
      - name: Smoke-test installed wheel
        run: |
          set -euo pipefail
          wheel_venv="$RUNNER_TEMP/wheel-venv"
          smoke_dir="$RUNNER_TEMP/wheel-smoke"
          uv venv --python 3.11 "$wheel_venv"
          uv pip install --python "$wheel_venv/bin/python" dist/*.whl
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          "$wheel_venv/bin/python" -m feishu_shadow_agent --help
          "$wheel_venv/bin/python" - <<'PY'
          from importlib.resources import files

          index = files("feishu_shadow_agent").joinpath("console_static").joinpath("index.html")
          assert index.is_file(), f"missing packaged console index: {index}"
          html = index.read_text(encoding="utf-8")
          assert '<div id="root">' in html, "packaged index is not the Operator Console shell"
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*

  coverage:
    name: Coverage (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.4"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked project environment
        run: uv sync --locked --extra cards
      - name: Report coverage
        run: >-
          uv run --locked pytest -q
          --cov=feishu_shadow_agent
          --cov-report=term-missing

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.4"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked project environment
        run: uv sync --locked --extra cards
      - name: Audit Python dependencies
        run: >-
          uv run --locked pip-audit
          --local
          --skip-editable
          --progress-spinner off
