name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests (Python ${{ matrix.python }}, ${{ matrix.timezone }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            timezone: UTC
          - python: "3.11"
            timezone: Asia/Shanghai
          - python: "3.11"
            timezone: America/Los_Angeles
          - python: "3.12"
            timezone: UTC
          - python: "3.13"
            timezone: UTC
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and optional card SDK
        run: python -m pip install -e ".[dev,cards]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Strict type checks for new modules
        run: python -m pyright --pythonpath "$(command -v python)"
      - name: Full test suite
        run: python -m pytest -q

  frontend:
    name: Operator Console build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/operator-console/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend/operator-console ci
      - name: Audit frontend dependencies
        run: >-
          npm --prefix frontend/operator-console audit
          --audit-level=high
          --registry=https://registry.npmjs.org
      - name: Lint Operator Console
        run: npm --prefix frontend/operator-console run lint
      - name: Test Operator Console
        run: npm --prefix frontend/operator-console test
      - name: Build bundled Operator Console
        run: npm --prefix frontend/operator-console run build
      - name: Verify bundled assets are current
        run: git diff --exit-code -- src/feishu_shadow_agent/console_static

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build
      - name: Inspect wheel assets
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              index = "feishu_shadow_agent/console_static/index.html"
              assert index in names, f"missing {index}"
              html = archive.read(index).decode("utf-8")
              for ref in html.split('/assets/')[1:]:
                  asset = ref.split('"', 1)[0].split("'", 1)[0]
                  path = f"feishu_shadow_agent/console_static/assets/{asset}"
                  assert path in names, f"missing {path}"
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*

  coverage:
    name: Coverage (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,cards]"
      - name: Report coverage
        run: >-
          python -m pytest -q
          --cov=feishu_shadow_agent
          --cov-report=term-missing

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,cards]"
      - name: Audit Python dependencies
        run: >-
          python -m pip_audit
          --local
          --skip-editable
          --progress-spinner off
