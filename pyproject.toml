[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-shadow-agent"
version = "0.1.0"
description = "Local Feishu shadow agent foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0.1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
cards = [
  "lark-channel-sdk>=1.2,<2",
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pre-commit>=4.6,<5",
  "pyright>=1.1.408,<2",
  "pytest>=8.0",
  "pytest-cov>=7,<8",
  "ruff>=0.15.20,<0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"feishu_shadow_agent" = ["console_static/*", "console_static/assets/*"]
"feishu_shadow_agent.store" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = [
  "src/feishu_shadow_agent/approval_cards.py",
  "src/feishu_shadow_agent/card_actions.py",
  "src/feishu_shadow_agent/decision.py",
  "src/feishu_shadow_agent/operator_queries/feedback.py",
]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
extend-exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501", "W505", "E402"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
