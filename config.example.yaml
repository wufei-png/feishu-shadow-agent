owner:
  open_id: ou_owner
  name: 张三

daemon:
  tick_interval_seconds: 60
  overlap_seconds: 120

health:
  interval_seconds: 300
  retry_interval_seconds: 60
  timeout_seconds: 10

storage:
  sqlite_path: data/agent.sqlite3
  resource_dir: data/resources
  max_resource_bytes: 52428800
  max_resource_dir_bytes: 2147483648

logging:
  jsonl_path: logs/agent.jsonl
  level: info
  console: true
  text_path: logs/agent.log

lark_cli:
  path: null
  timeout_seconds: 30

# Optional interactive approval cards. Credentials are read from the named environment
# variables; never put the credential values in this file.
interactive_cards:
  enabled: false
  app_id_env: FEISHU_APP_ID
  app_secret_env: FEISHU_APP_SECRET
  startup_timeout_seconds: 10

agent_backend:
  provider: hermes
  # Agent subprocess working directory. null means the directory containing config.yaml.
  working_dir: null
  config_scope: isolated
  auto_context: disabled
  explicit_context:
    # Absolute non-native skill paths shown as not-yet-loaded context only when a Task Session is created.
    paths: []
  hermes:
    mode: cli
    path: null
    source: feishu-shadow-agent
    router_max_turns: 4
    session_max_turns: 8
    model: null
    provider: null
    # null lets the Agent finish its configured turns without a wall-clock cutoff.
    timeout_seconds: null
    # Native Hermes skill directories or SKILL.md paths passed with --skills.
    skill_paths: []
    # HTTP mode compatibility. Used only when mode: http.
    health_url: null
    api_key_env: HERMES_API_KEY
  codex:
    path: null
    model: null
    # minimal, low, medium, high, or xhigh; null uses the Codex default.
    reasoning_effort: null
    timeout_seconds: null
    # Codex-native skill names. Each new Task Session prompt ends with $name.
    skills: []
  claude_code:
    path: null
    model: null
    timeout_seconds: null

reply_policy:
  p2p_auto_reply: true
  unknown_group_auto_reply: false

reply_postprocess:
  # Disabled by default. To enable, turn on this flag plus at least one guidance source below.
  enabled: false
  max_turns: 4
  # null inherits the selected backend's model/provider where supported.
  model: null
  provider: null
  owner_style:
    enabled: false
    # Generate with: python -m feishu_shadow_agent reply-style refresh --config config.yaml
    profile_path: data/owner_style.zh.md
    refresh:
      lookback_days: 30
      max_samples: 300
      min_samples: 20
  humanizer_zh:
    enabled: false
    # Required when enabled; null avoids a machine-specific default path.
    skill_path: null

chats:
  oc_xxx:
    name: 示例产品群
    auto_reply: true
    bot_joined: true
    reply_identity: bot_preferred
    allow_user_fallback: true
    resource_download: true

tool_permissions: read_only

retention:
  raw_message_days: 30
  resource_days: 30
  feedback_content_days: 30
  feedback_metadata_days: 365

lifecycle:
  watch_minutes: 120
  burst_attach_seconds: 60
  closed_recall_days: 7
  approval_timeout_hours: 24

debug:
  save_full_agent_io: false
