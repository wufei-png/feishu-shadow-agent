owner:
  open_id: ou_owner
  name: 张三

daemon:
  tick_interval_seconds: 60
  overlap_seconds: 120

health:
  interval_seconds: 300
  retry_interval_seconds: 60
  timeout_seconds: 10

storage:
  sqlite_path: data/agent.sqlite3
  resource_dir: data/resources
  max_resource_bytes: 52428800
  max_resource_dir_bytes: 2147483648

logging:
  jsonl_path: logs/agent.jsonl
  level: info
  console: true
  text_path: logs/agent.log

lark_cli:
  path: null
  timeout_seconds: 30

agent_backend:
  provider: hermes
  config_scope: isolated
  auto_context: disabled
  explicit_context:
    # Skill directories or SKILL.md file paths; only injected into task-session turns.
    skills: []
  hermes:
    mode: cli
    path: null
    source: feishu-shadow-agent
    router_max_turns: 4
    session_max_turns: 8
    model: null
    provider: null
    timeout_seconds: 60
    # HTTP mode compatibility. Used only when mode: http.
    health_url: null
    api_key_env: HERMES_API_KEY

reply_policy:
  p2p_auto_reply: true
  unknown_group_auto_reply: false

chats:
  oc_xxx:
    name: 示例产品群
    auto_reply: true
    bot_joined: true
    reply_identity: bot_preferred
    allow_user_fallback: true
    resource_download: true

tool_permissions: guarded_write

retention:
  raw_message_days: 30
  resource_days: 30

lifecycle:
  watch_minutes: 120
  closed_recall_days: 7
  approval_timeout_hours: 24

debug:
  save_full_agent_io: false
